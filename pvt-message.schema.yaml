$id: pvt-message.schema.yaml
$schema: https://json-schema.org/draft/2020-12/schema

title: OGRP PVT message
description: The PVT message contains a minimal set of properties computed by each PVT algorithm.
type: object
allOf:
  - $ref: './message.schema.yaml#/$defs/BaseProperties'
  - $ref: './message.schema.yaml#/$defs/CustomProperties'
properties:
  $schema:
    const: https://fraunhofer-iis.github.io/ogrp/next/pvt-message
  pvt:
    $ref: './pvt.schema.yaml'
