name: Validate JSON Schema

on:
  push:
    branches: [ next ]
  pull_request:
    branches: [ next ]

jobs:
  validate-json:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/pip
          ${{ env.pythonLocation }}/bin
          ${{ env.pythonLocation }}/lib/python*/site-packages
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install check-jsonschema
      run: |
        python -m pip install --upgrade pip
        pip install check-jsonschema

    - name: Validate JSON files
      run: |
        shopt -s nullglob
        for json_file in examples/*.json; do
          schema_file="$(basename "$json_file" .json).schema.yaml"
          if [[ -f "$schema_file" ]]; then
            echo "Validating $json_file against $schema_file"
            check-jsonschema --schemafile "$schema_file" "$json_file"
          else
            echo "Error: No schema found for $json_file"
            exit 1
          fi
        done
